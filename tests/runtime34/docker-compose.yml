# LOCAL TEST STACK ONLY: OJS 3.4.0-12 + MariaDB 10.11 for NusantaraReborn — http://localhost:8102
# The theme is NOT mounted; it is installed from the built tarball through the Plugin Manager.
name: nr34-test
services:
  db:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ojs
      MARIADB_USER: ojs
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - dbdata:/var/lib/mysql
    restart: unless-stopped
  web:
    build: .
    depends_on: [db]
    ports:
      - "127.0.0.1:8102:80"
    volumes:
      - ./.work/ojs:/var/www/html
      - ./.work/files:/var/www/files
      - ./.work/logs:/var/log/apache2
    restart: unless-stopped
volumes:
  dbdata:
